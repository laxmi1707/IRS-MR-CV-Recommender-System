<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Rank ICRS — Intelligent Candidate Ranking System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #1E3763;
    --orange: #E87621;
    --bg: #F7F6F3;
    --card: #FFFFFF;
    --border: #e5e2dd;
    --text: #2c2c2c;
    --muted: #888;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

  /* Header */
  .header {
    background: var(--navy);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 8px; background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: white; font-size: 15px; font-family: 'DM Serif Display', serif;
  }
  .header-title { color: white; font-weight: 700; font-size: 18px; font-family: 'DM Serif Display', serif; }
  .header-sub { color: #8ea8cc; font-size: 11px; }

  /* Container */
  .container { max-width: 920px; margin: 0 auto; padding: 24px; }

  /* Form */
  label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  input[type="text"], textarea {
    width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: white; transition: border-color 0.2s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,118,33,0.12); }
  textarea { resize: vertical; line-height: 1.6; }

  /* Upload area */
  .upload-area {
    border: 2px dashed #ccc; border-radius: 10px; padding: 28px; text-align: center;
    cursor: pointer; transition: all 0.2s; background: white; margin: 16px 0;
    position: relative;
  }
  .upload-area:hover { border-color: var(--orange); background: #fff8f2; }
  .upload-area.has-files { border-color: var(--orange); border-style: solid; }
  .upload-icon { font-size: 32px; margin-bottom: 6px; color: var(--orange); }
  .file-list { margin-top: 12px; text-align: left; }
  .file-item {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    background: #f0ebe4; border-radius: 6px; font-size: 12px; margin: 3px 4px;
    color: var(--navy); font-weight: 500;
  }
  .file-remove { cursor: pointer; color: #c00; font-weight: 700; margin-left: 4px; }

  /* Button */
  .btn-rank {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--orange); color: white; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'DM Serif Display', serif; letter-spacing: 0.3px;
    transition: all 0.2s; margin-top: 16px;
  }
  .btn-rank:hover { background: #d06a1a; transform: translateY(-1px); }
  .btn-rank:disabled { background: #aaa; cursor: default; transform: none; }
  .btn-rank.loading { animation: pulse 1.2s infinite; }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  /* Results */
  .summary-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .summary-card {
    flex: 1; min-width: 140px; background: white; border-radius: 10px;
    padding: 14px 18px; border: 1px solid var(--border);
  }
  .summary-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .summary-value { font-size: 24px; font-weight: 800; color: var(--navy); font-family: 'DM Serif Display', serif; margin-top: 4px; }

  /* Candidate card */
  .candidate-card {
    background: white; border-radius: 12px; padding: 20px; margin-bottom: 14px;
    border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
    animation: fadeIn 0.4s ease;
  }
  .candidate-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .candidate-card.rank-1 { border: 2px solid var(--orange); box-shadow: 0 4px 20px rgba(232,118,33,0.12); }

  .card-header { display: flex; align-items: center; gap: 14px; }
  .rank-badge {
    width: 44px; height: 44px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; color: white;
    font-weight: 700; font-size: 18px; font-family: 'DM Serif Display', serif;
  }
  .rank-1 { background: #FFD700; }
  .rank-2 { background: #C0C0C0; }
  .rank-3 { background: #CD7F32; }
  .rank-other { background: var(--navy); }

  .card-info { flex: 1; }
  .card-name { font-weight: 700; font-size: 17px; color: var(--navy); font-family: 'DM Serif Display', serif; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card-score { text-align: right; }
  .score-big { font-size: 28px; font-weight: 800; font-family: 'DM Serif Display', serif; }
  .score-unit { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  .score-high { color: #16a34a; }
  .score-mid { color: var(--orange); }
  .score-low { color: #dc2626; }

  /* Dimension pills */
  .dim-pills { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .dim-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500;
  }
  .pill-high { background: #dcfce7; color: #166534; }
  .pill-mid { background: #fef3c7; color: #92400e; }
  .pill-low { background: #fee2e2; color: #991b1b; }

  /* Expanded details */
  .card-details { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); animation: fadeIn 0.3s; }

  .score-bar-container { margin-bottom: 10px; }
  .score-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; color: #555; }
  .score-bar-value { font-weight: 600; }
  .score-bar-track { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

  .justification {
    margin-top: 14px; padding: 14px; background: #f8f7f4; border-radius: 8px;
    border-left: 3px solid var(--orange); border-radius: 0 8px 8px 0;
  }
  .justification-title { font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .justification-text { font-size: 13px; color: #444; line-height: 1.6; }

  .skills-section { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .skills-group { flex: 1; min-width: 180px; }
  .skills-group-title { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .skill-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin: 2px; }
  .skill-matched { background: #dcfce7; color: #166534; }
  .skill-missing { background: #fee2e2; color: #991b1b; }

  .dim-explanation { margin-top: 8px; font-size: 12px; color: #666; line-height: 1.5; }
  .dim-explanation strong { color: var(--navy); font-weight: 600; }

  /* Radar chart */
  .radar-container { display: flex; justify-content: center; margin: 10px 0; }

  /* Error */
  .error-box { background: #fee2e2; border: 1px solid #f09595; border-radius: 8px; padding: 14px; color: #791f1f; font-size: 13px; margin-top: 12px; }

  /* Back button */
  .btn-back {
    padding: 8px 18px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: white; font-size: 12px; cursor: pointer;
    font-weight: 600; margin-left: auto; font-family: inherit;
  }
  .btn-back:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">SR</div>
  <div>
    <div class="header-title">S-Rank ICRS</div>
    <div class="header-sub">Intelligent Candidate Ranking System &middot; NUS-ISS MTech AI</div>
  </div>
  <button class="btn-back" id="backBtn" style="display:none" onclick="showInput()">&#8592; New Search</button>
</div>

<div class="container">
  <!-- INPUT VIEW -->
  <div id="inputView">
    <div style="margin-bottom: 18px">
      <label for="jobTitle">Job Title</label>
      <input type="text" id="jobTitle" value="Senior Data Scientist" />
    </div>

    <div style="margin-bottom: 18px">
      <label for="jobDesc">Job Description</label>
      <textarea id="jobDesc" rows="10">We are looking for a Senior Data Scientist with 5+ years of experience in machine learning and data science.

Required Skills:
- Python, TensorFlow, PyTorch
- SQL, data pipeline design
- AWS cloud services
- Machine Learning model development and deployment
- Statistics and A/B testing

Education: Master's degree in Computer Science, Statistics, or related field.
Notice Period: Within 60 days preferred.</textarea>
    </div>

    <div>
      <label>Upload Resumes (PDF / DOCX)</label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">+</div>
        <div style="font-size:14px; font-weight:600; color:var(--navy)">Click to select resume files</div>
        <div style="font-size:12px; color:var(--muted); margin-top:4px">Supports PDF and DOCX &middot; Upload multiple files</div>
        <div class="file-list" id="fileList"></div>
      </div>
      <input type="file" id="fileInput" multiple accept=".pdf,.docx,.doc" style="display:none" onchange="handleFiles(this.files)" />
    </div>

    <button class="btn-rank" id="rankBtn" onclick="rankCandidates()">
      Rank Candidates
    </button>

    <div id="errorBox" class="error-box" style="display:none"></div>
  </div>

  <!-- RESULTS VIEW -->
  <div id="resultsView" style="display:none"></div>
</div>

<script>
const API_URL = "http://localhost:8000";
let uploadedFiles = [];

function handleFiles(files) {
  for (let f of files) {
    if (!uploadedFiles.find(u => u.name === f.name)) {
      uploadedFiles.push(f);
    }
  }
  renderFileList();
  event.stopPropagation();
}

function removeFile(idx) {
  uploadedFiles.splice(idx, 1);
  renderFileList();
  event.stopPropagation();
}

function renderFileList() {
  const el = document.getElementById("fileList");
  const area = document.getElementById("uploadArea");
  if (uploadedFiles.length === 0) {
    el.innerHTML = "";
    area.classList.remove("has-files");
    return;
  }
  area.classList.add("has-files");
  el.innerHTML = uploadedFiles.map((f, i) =>
    `<span class="file-item">${f.name} <span class="file-remove" onclick="removeFile(${i})">&times;</span></span>`
  ).join("");
}

function getScoreClass(score) {
  if (score >= 75) return "high";
  if (score >= 50) return "mid";
  return "low";
}

function createRadarSVG(dimensions, size) {
  const cx = size/2, cy = size/2, r = size/2 - 28;
  const n = dimensions.length;
  const step = 2 * Math.PI / n;
  const pt = (i, val) => {
    const a = i * step - Math.PI/2;
    const d = (val/100) * r;
    return { x: cx + d*Math.cos(a), y: cy + d*Math.sin(a) };
  };

  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;

  // Grid
  [0.25, 0.5, 0.75, 1.0].forEach(level => {
    const pts = Array.from({length:n}, (_,i) => pt(i, level*100));
    const d = pts.map((p,i) => `${i===0?"M":"L"}${p.x},${p.y}`).join(" ") + "Z";
    svg += `<path d="${d}" fill="none" stroke="#ddd" stroke-width="0.5"/>`;
  });

  // Axes
  for (let i=0; i<n; i++) {
    const end = pt(i, 100);
    svg += `<line x1="${cx}" y1="${cy}" x2="${end.x}" y2="${end.y}" stroke="#e0e0e0" stroke-width="0.5"/>`;
  }

  // Data polygon
  const dataPoints = dimensions.map((d,i) => pt(i, d.score));
  const pathD = dataPoints.map((p,i) => `${i===0?"M":"L"}${p.x},${p.y}`).join(" ") + "Z";
  svg += `<path d="${pathD}" fill="rgba(232,118,33,0.2)" stroke="#E87621" stroke-width="2"/>`;
  dataPoints.forEach(p => { svg += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#E87621"/>`; });

  // Labels
  dimensions.forEach((d,i) => {
    const lp = pt(i, 118);
    const short = d.name.replace("Technical Skills","Tech").replace("Miscellaneous","Misc");
    svg += `<text x="${lp.x}" y="${lp.y}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#666" font-weight="500" font-family="DM Sans,sans-serif">${short}</text>`;
  });

  svg += "</svg>";
  return svg;
}

async function rankCandidates() {
  const btn = document.getElementById("rankBtn");
  const errBox = document.getElementById("errorBox");
  errBox.style.display = "none";

  if (uploadedFiles.length === 0) {
    errBox.textContent = "Please upload at least one resume file (PDF or DOCX).";
    errBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.classList.add("loading");
  btn.textContent = "Analyzing resumes with S-Rank pipeline...";

  try {
    const formData = new FormData();
    formData.append("job_title", document.getElementById("jobTitle").value);
    formData.append("job_description", document.getElementById("jobDesc").value);
    uploadedFiles.forEach(f => formData.append("resumes", f));

    const res = await fetch(API_URL + "/api/rank", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.message || "Server returned an error");
    }

    renderResults(data);

  } catch (err) {
    errBox.textContent = "Error: " + err.message + ". Make sure the backend is running (python -m uvicorn main:app --reload --port 8000)";
    errBox.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    btn.textContent = "Rank Candidates";
  }
}

function renderResults(data) {
  document.getElementById("inputView").style.display = "none";
  document.getElementById("backBtn").style.display = "block";
  const view = document.getElementById("resultsView");
  view.style.display = "block";

  let html = "";

  // Summary bar
  const topScore = data.candidates[0]?.overall_score || 0;
  html += `<div class="summary-bar">
    <div class="summary-card">
      <div class="summary-label">Position</div>
      <div class="summary-value" style="font-size:18px">${data.job_description.title}</div>
    </div>
    <div class="summary-card" style="flex:0 0 120px; text-align:center">
      <div class="summary-label">Candidates</div>
      <div class="summary-value">${data.total_candidates}</div>
    </div>
    <div class="summary-card" style="flex:0 0 120px; text-align:center">
      <div class="summary-label">Top Score</div>
      <div class="summary-value score-${getScoreClass(topScore)}">${topScore}</div>
    </div>
  </div>`;

  // Skills tags
  if (data.job_description.required_skills?.length) {
    html += `<div style="margin-bottom:16px; display:flex; gap:6px; flex-wrap:wrap; align-items:center">
      <span style="font-size:11px; font-weight:700; color:var(--navy)">Required:</span>
      ${data.job_description.required_skills.map(s =>
        `<span style="font-size:11px; padding:2px 8px; border-radius:4px; background:rgba(30,55,99,0.08); color:var(--navy); font-weight:500">${s}</span>`
      ).join("")}
    </div>`;
  }

  // Candidate cards
  data.candidates.forEach((c, idx) => {
    const rankClass = c.rank <= 3 ? `rank-${c.rank}` : "rank-other";
    const scoreClass = getScoreClass(c.overall_score);

    html += `<div class="candidate-card ${c.rank===1 ? 'rank-1':''}" onclick="toggleDetails(${idx})" id="card-${idx}">
      <div class="card-header">
        <div class="rank-badge ${rankClass}">${c.rank}</div>
        <div class="card-info">
          <div class="card-name">${c.name || 'Candidate ' + c.rank}</div>
          <div class="card-meta">${c.job_titles?.[0] || '—'} &middot; ${c.experience_years}y exp &middot; ${c.education_level} &middot; ${c.notice_period_days}d notice</div>
        </div>
        <div class="card-score">
          <div class="score-big score-${scoreClass}">${c.overall_score}</div>
          <div class="score-unit">/100</div>
        </div>
      </div>

      <div class="dim-pills" id="pills-${idx}">
        ${c.dimensions.map(d => {
          const cls = d.score >= 75 ? "pill-high" : d.score >= 50 ? "pill-mid" : "pill-low";
          const short = d.name.replace("Technical Skills","Tech").replace("Miscellaneous","Misc");
          return `<span class="dim-pill ${cls}">${short}: ${Math.round(d.score)}%</span>`;
        }).join("")}
      </div>

      <div class="card-details" id="details-${idx}" style="display:${idx===0?'block':'none'}">
        <div style="display:flex; gap:20px; flex-wrap:wrap">
          <div style="flex:1 1 260px">
            ${c.dimensions.map(d => {
              const color = d.score >= 75 ? "#16a34a" : d.score >= 50 ? "#E87621" : "#dc2626";
              return `<div class="score-bar-container">
                <div class="score-bar-label">
                  <span>${d.name}</span>
                  <span class="score-bar-value" style="color:${color}">${d.score.toFixed(1)}%</span>
                </div>
                <div class="score-bar-track">
                  <div class="score-bar-fill" style="width:${Math.min(d.score,100)}%; background:${color}"></div>
                </div>
              </div>`;
            }).join("")}
          </div>
          <div class="radar-container" style="flex:0 0 180px">
            ${createRadarSVG(c.dimensions, 180)}
          </div>
        </div>

        <div class="justification">
          <div class="justification-title">AI Justification</div>
          <div class="justification-text">${c.justification}</div>
        </div>

        <div class="skills-section">
          <div class="skills-group">
            <div class="skills-group-title" style="color:#166534">Matched Skills</div>
            ${(c.matched_skills||[]).map(s => `<span class="skill-tag skill-matched">${s}</span>`).join("") || '<span style="font-size:12px;color:#999">None detected</span>'}
          </div>
          <div class="skills-group">
            <div class="skills-group-title" style="color:#991b1b">Missing Skills</div>
            ${(c.missing_skills||[]).map(s => `<span class="skill-tag skill-missing">${s}</span>`).join("") || '<span style="font-size:12px;color:#999">None</span>'}
          </div>
        </div>

        ${c.dimensions.map(d =>
          `<div class="dim-explanation"><strong>${d.name}:</strong> ${d.explanation}</div>`
        ).join("")}
      </div>
    </div>`;
  });

  view.innerHTML = html;
}

function toggleDetails(idx) {
  const details = document.getElementById("details-" + idx);
  if (details) {
    details.style.display = details.style.display === "none" ? "block" : "none";
  }
}

function showInput() {
  document.getElementById("inputView").style.display = "block";
  document.getElementById("resultsView").style.display = "none";
  document.getElementById("backBtn").style.display = "none";
}

// Drag and drop support
const uploadArea = document.getElementById("uploadArea");
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.style.borderColor = "#E87621"; });
uploadArea.addEventListener("dragleave", e => { e.preventDefault(); uploadArea.style.borderColor = ""; });
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.style.borderColor = "";
  handleFiles(e.dataTransfer.files);
});
</script>

</body>
</html>
